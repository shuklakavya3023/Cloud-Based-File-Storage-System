<!DOCTYPE html><html><head><title>Dashboard</title></head>
<body style="font-family:Arial;margin:30px">
<h2>Welcome {{ user.name }} 👋</h2><p>{{ user.email }} | <a href="/logout">Logout</a></p><hr>
<h3>Upload to S3</h3>
<form action="/upload" method="post" enctype="multipart/form-data">
<input type="file" name="file" required><button type="submit">Upload</button></form><hr>
<h3>My Files ({{ files|length }})</h3><ul>
{% for file in files %}<li>{{ file }} - <a href="/download/{{ file }}">Download</a> | <a href="/delete/{{ file }}" style="color:red">Delete</a></li>{% endfor %}
</ul></body></html>
